# Release to WordPress.org SVN whenever a version tag is pushed to GitHub.
#
# The git tag IS the SVN tag: pushing `0.2.0` creates /tags/0.2.0 on WordPress.org and a GitHub
# Release named 0.2.0 with the same ZIP attached. The job refuses to run if the tag does not
# match the plugin's "Version:" header and the readme's "Stable tag:", so the three can never
# drift apart.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   SVN_USERNAME  - WordPress.org username
#   SVN_PASSWORD  - WordPress.org password (or SVN application password)

name: Deploy to WordPress.org

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  deploy:
    name: Tag ${{ github.ref_name }} → SVN + GitHub Release
    runs-on: ubuntu-latest
    env:
      SLUG: nextsim-woo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify the tag matches the plugin version
        run: |
          TAG="${GITHUB_REF_NAME}"
          HEADER=$(grep -E '^\s*\*\s*Version:' nextsim-woo.php | head -1 | sed -E 's/.*Version:\s*//' | tr -d '[:space:]')
          STABLE=$(grep -E '^Stable tag:' readme.txt | head -1 | sed -E 's/Stable tag:\s*//' | tr -d '[:space:]')
          echo "tag=$TAG header=$HEADER stable=$STABLE"
          if [ "$TAG" != "$HEADER" ] || [ "$TAG" != "$STABLE" ]; then
            echo "::error::Tag $TAG must equal the Version header ($HEADER) and readme Stable tag ($STABLE)."
            exit 1
          fi

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
          coverage: none

      - name: Install runtime dependencies (QR library)
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Deploy to WordPress.org
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: ${{ env.SLUG }}
          VERSION: ${{ github.ref_name }}

      - name: Create the GitHub Release with the same ZIP
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: ${{ steps.deploy.outputs.zip-path }}
          generate_release_notes: true
